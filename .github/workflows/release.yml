name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: Allow an unsigned development build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run build:win
          - os: ubuntu-latest
            command: npm run build:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build artifacts
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: ${{ matrix.command }}
      - name: Report signing configuration
        shell: bash
        run: npm run signing:status
      - name: Verify release signatures
        if: startsWith(github.ref, 'refs/tags/v') && inputs.allow_unsigned != true
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            echo "Refusing an unsigned tagged release: WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD are not configured." >&2
            exit 1
          fi
          node scripts/verify-artifacts.js --require-signed
      - name: Verify development artifacts
        if: startsWith(github.ref, 'refs/tags/v') != true || inputs.allow_unsigned == true
        shell: bash
        run: node scripts/verify-artifacts.js
      - name: Generate checksums
        shell: bash
        run: npm run checksums
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.sha256
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error
